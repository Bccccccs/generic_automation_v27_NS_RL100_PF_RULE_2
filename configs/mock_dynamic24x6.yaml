mock_dynamic24x6:
  # Spatial coupling from 24 jets to 6 load regions. Jets are grouped by fours:
  # 01-04 -> S1L, 05-08 -> S1R, 09-12 -> S2L, 13-16 -> S2R,
  # 17-20 -> S3L, 21-24 -> S3R.
  primary_gain: 5.0
  same_station_cross_side_gain: 0.9
  adjacent_station_gain: 0.65
  far_station_gain: 0.22

  # Upstream jets affect downstream regions later than local regions.
  upstream_delay_per_station: 0.08
  same_station_delay: 0.0
  downstream_delay: 0.02

  # First-order response inertia by station.
  tau_s1: 0.10
  tau_s2: 0.14
  tau_s3: 0.18

  # Small reproducible noise.
  fz_noise_std: 0.035
  drag_noise_std: 0.01
  moment_noise_std: 0.015

  # Derived global output coefficients.
  drag_base: 0.0
  drag_massflow_gain: 0.35
  drag_lift_rms_gain: 0.08
  jet_reaction_gain: 1.0
  output_clip: 1000000.0
  group_size: 4
