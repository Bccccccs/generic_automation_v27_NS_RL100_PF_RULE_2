project_name: train_aerodynamics
#项目名称
adapter: starccm
#仿真后端
result_root: ../results

case_name: case_train_c80_g
#当前例子
starccm_path: "starccm+"
template_sim: ""
#sim文件路径
num_cores: 128

pod_key: ""

region_name: Subtract
inlet_boundary: Subtract.base.inlet
outlet_boundary: Subtract.base.outlet
wall_boundary: Subtract.train.Faces
ground_boundary: Subtract.base.ground
ground_sliding: true
symmetry_boundary: Subtract.base.side1

domain_block_name: base           
zone1_name: zone1                
zone2_name: zone2                 
train_surface_control_name: ""
prism_mesher_name: Prism Layer Mesher
max_steps_criterion_name: Maximum Steps


case:
  
  inlet_velocity: 44.44           
  inlet_temperature: 293.15       
  outlet_pressure: 0.0            

  
  base_mesh_size: 1.28
  surface_mesh_size: 0.08
  min_surface_size: 0.06
  surface_growth_rate: 1.3
  num_prism_layers: 10
  prism_layer_thickness: 0.01
  prism_layer_stretching: 1.3
  prism_wall_thickness: 1.0e-4

  train_target_size: 0.08
  train_min_size: 0.06
  train_prism_thickness: 0.15
  train_prism_layers: 0

  zone1_mesh_size: 0.64
  zone2_mesh_size: 0.20           

  turbulence_model: k-omega-sst
  fluid: air
  energy_equation: false
  simulation_type: steady         

  inlet_turbulence_intensity: 0.01
  inlet_turbulent_length_scale: 0.5

  max_iterations: 1000
  convergence_residual: 1.0e-5
  pressure_relaxation_factor: 0.30
  pressure_relaxation_initial_value: 0.07
  pressure_relaxation_start_iteration: 1
  pressure_relaxation_end_iteration: 10
  velocity_relaxation_initial_value: 0.07
  velocity_relaxation_start_iteration: 1
  velocity_relaxation_end_iteration: 10
  pressure_amg_cycle: 0
  velocity_amg_cycle: 0
  time_step: 0.005                
  num_time_steps: 500             

  report_names:
    - drag
    - total
    - train_surface_pressure_max

  domain_corner1: [-50.0, -50.0, 0.0]
  domain_corner2: [120.0, 50.0, 50.0]  

  initial_velocity: 0.0
  monitor_start_iteration: 0
  monitor_update_frequency: 1

 
  wall_treatment: all-y-plus
  cad_sharp_angle: 30.0

  log_frequency: 1
  drag_report_name: drag
  total_report_name: total
  pressure_report_name: train_surface_pressure_max
  train_surface_pressure_report_name: train_surface_pressure_max



ai_optimization:
  enabled: true
  controller: reinforcement_learning

  check_interval: 30
  decision_interval_iterations: 30
  rl_start_iteration: 10
  poll_interval: 1.0
  cooldown_iterations: 30
  force_trigger_every_iterations:
  force_trigger_max_count:

  trigger:
    steady:
      min_window: 30
      stagnation_threshold: 0.01
      worsening_threshold: 0.03
      output_metrics:
        - name: drag
          goal: minimize
          stagnation_threshold: 0.01
          worsening_threshold: 0.03
        - name: train_surface_pressure_max
          goal: minimize
          stagnation_threshold: 0.01
          worsening_threshold: 0.03
    transient:                       
      min_window: 50
      divergence_threshold: 1.0e6   
      rise_threshold: 5000.0
      output_metrics:
        - name: drag
          goal: minimize
          rise_threshold: 5000.0
        - name: train_surface_pressure_max
          goal: minimize
          rise_threshold: 5000.0

  optimization_goal: "use reinforcement learning to reduce drag and train surface pressure by tuning the pressure relaxation factor, pressure/velocity under-relaxation ramps, and pressure/velocity AMG cycle while preserving numerical stability"

  reinforcement_learning:
    intervention_enabled: true
    learning_rate: 0.25
    discount_factor: 0.90
    epsilon: 0.10
    epsilon_decay: 0.99
    min_epsilon: 0.02
    baseline_final_total:
    priority_disallow_hold: false
    prefer_hold_on_nonpositive_q: true
    allowed_parameters:
      - pressure_relaxation_factor
      - pressure_relaxation_initial_value
      - pressure_relaxation_end_iteration
      - pressure_amg_cycle
      - velocity_amg_cycle
    relaxation_step: 0.02
    observation_window: 10
    baseline_min_samples: 3
    speed_score_clip_range: 2.0
    state_tolerance: 0.01
    toggle_penalty: 0.02
    drag_weight: 0.60
    pressure_weight: 0.40
    physics_gate_start_fraction: 0.10
    physics_gate_full_fraction: 0.50
    physics_gate_disable_residual_ratio: 100.0
    physics_gate_full_residual_ratio: 5.0
    physics_gate_severe_drift_multiplier: 5.0
    physics_gate_severe_min: 0.25
    pause_after_catastrophic_trip: false
    catastrophic_recovery_cooldown_cycles: 3
    catastrophic_pressure_limit: 1.0e4
    catastrophic_pressure_amplitude_limit: 5.0e3
    catastrophic_pressure_growth_ratio: 2.5
    catastrophic_turbulent_viscosity_limited_cells: 80
    block_pressure_relaxation_up_on_instability: true
    block_pressure_relaxation_up_residual_limit: 1.0
    block_pressure_relaxation_up_pressure_limit: 1.0e4
    block_pressure_relaxation_up_pressure_amplitude_limit: 5.0e3
    block_pressure_relaxation_up_turbulent_viscosity_limited_cells: 80
    manual_rules:
      enabled: true
      startup_end_iteration: 50
      startup_pressure_relaxation_factor_max: 0.32
      startup_pressure_relaxation_initial_value_max: 0.10
      startup_pressure_relaxation_end_iteration_min: 30
      startup_block_velocity_cycle_changes: true
      pressure_stress_lookback_windows: 3
      pressure_stress_required_hits: 2
      pressure_stress_amg_cycle_hit_ratio: 0.95
      pressure_stress_solver_iterations_threshold: 15
      pressure_stress_pressure_relaxation_factor_max: 0.30
      pressure_stress_pressure_relaxation_initial_value_max: 0.08
      pressure_stress_pressure_relaxation_end_iteration_min: 50
      pressure_stress_force_pressure_amg_cycle: 1
      pressure_stress_block_velocity_cycle_changes: true
      stable_min_iteration: 120
      stable_lookback_windows: 4
      stable_continuity_drop_ratio: 0.80
      stable_drag_amplitude_ratio_max: 0.10
      stable_tke_residual_max: 1.0
      stable_force_velocity_amg_cycle: 1
      stable_force_pressure_amg_cycle: 0
      tke_guard_lookback_windows: 4
      tke_rebound_growth_ratio: 1.8
      tke_recent_increase_ratio: 1.25
      tke_rebound_absolute_limit: 1.0
      tke_guard_pressure_relaxation_factor_max: 0.30
      tke_guard_pressure_relaxation_initial_value_max: 0.08
      tke_guard_pressure_relaxation_end_iteration_min: 50
      tke_guard_force_pressure_amg_cycle: 1
      tke_guard_force_velocity_amg_cycle: 0

  parameter_constraints:
    inlet_velocity:               {min: 10.0,    max: 150.0}
    inlet_temperature:            {min: 250.0,   max: 400.0}
    outlet_pressure:              {min: -500.0,  max: 500.0}
    inlet_turbulence_intensity:   {min: 0.001,   max: 0.1}
    inlet_turbulent_length_scale: {min: 0.01,    max: 5.0}
    convergence_residual:         {min: 1.0e-7,  max: 1.0e-3}
    max_iterations:               {min: 1000,    max: 20000}
    pressure_relaxation_factor:   {min: 0.30,    max: 0.38}
    pressure_relaxation_initial_value:   {min: 0.01,    max: 0.95}
    pressure_relaxation_start_iteration: {min: 0,       max: 200}
    pressure_relaxation_end_iteration:   {min: 1,       max: 400}
    velocity_relaxation_initial_value:   {min: 0.01,    max: 0.95}
    velocity_relaxation_start_iteration: {min: 0,       max: 200}
    velocity_relaxation_end_iteration:   {min: 1,       max: 400}
    pressure_amg_cycle:           {min: 0,       max: 1}
    velocity_amg_cycle:           {min: 0,       max: 1}
    amg_cycle:                    {min: 0,       max: 1}
    amg_solver:                   {min: 0,       max: 1}
    time_step:                    {min: 1.0e-5,  max: 0.1}
