schema_version: B01_0816_star_fields_v1
case_id: "<case_id>"
case_type: "<jet_on|no_jet>"
case_stage: starccm_output_organized
created_time: "<ISO-8601 UTC>"
source_product_dir: raw_star/out_put
initial_transient_crop:
  end_time_s: 0.5
  keep_rule: "physical_time >= 0.5 s"
reference_cases:
  j02_pulse: runs/week4/j02_pluse_0816
  j06_pulse: runs/week4/j06_pluse_0816
  no_jet: runs/week4/no_0816
star:
  version: "待浩坤确认"
  sim_file: "待浩坤确认"
  sim_file_hash_sha256: "待浩坤确认"
  geometry_version: "待浩坤确认"
  mesh_version: "待浩坤确认"
  region_names: [减运算]
  coordinate_system: Laboratory
field_contract:
  action_schedule_columns:
    time: [time, window_id, t_start, t_end]
    switches: JET_01..JET_24
    commanded_massflow: cmd_massflow_01..cmd_massflow_24
  timeseries_columns:
    action: [JET_01..JET_24, cmd_massflow_01..cmd_massflow_24]
    star_raw_actual_massflow: star_actual_massflow_01..star_actual_massflow_24
    actual_massflow: actual_massflow_01..actual_massflow_24
    force_and_moment: [Fz_S1L, Fz_S1R, Fz_S2L, Fz_S2R, Fz_S3L, Fz_S3R, Fz_Total, Drag_Total, Pitch_Moment, Roll_Moment, Jet_Reaction_Z]
    raw_only_not_in_processed_timeseries: [fz]
  j_jet_mapping_file: docs/week4/B01_J_JET_mapping.csv
  report_mapping_file: docs/week4/B01_report_mapping.csv
  policy: "Use the listed 0816 field names unchanged; do not synthesize vehicle lift, six-zone resultant, or momentum-reaction fields."
report_semantics:
  Fz_S1L..Fz_S3R: "FZ_image_10000.csv：底面分区域升力。"
  fz: "fz.csv：车底六区合力/底面整体升力；应等于六个Fz_S*分区升力之和，待后续算例验证。"
  Fz_Total: "Fz Monitor：带车壳升力，积分面为JET01..JET24加tail。"
  Jet_Reaction_Z: "J01..J24表面+Z力；是否代表喷气动量反作用力等待浩坤确认。"
surface_mapping:
  source: docs/week4/B01_J_JET_mapping.csv
  jet_boundary: J01..J24
  underbody_zone: JET01..JET24
  area_unit: m^2
  normal_coordinate_system: Laboratory
  normal_vectors: "Read per-channel values from B01_J_JET_mapping.csv."
coordinates:
  lift_force_direction: [0.0, 0.0, 1.0]
  drag_force_direction: [1.0, 0.0, 0.0]
  pitch_axis: [0.0, 1.0, 0.0]
  roll_axis: [1.0, 0.0, 0.0]
  moment_center_m: [29.0, 0.0, 1.52]
solver_time:
  time_step: 0.0001
  action_window_duration: 0.1
  solver_steps_per_action_window: 1000
  schedule_row_interval: 0.0001
  sampling_interval: 0.0001
  sample_count: 10000
  action_window_rule: "One 0.1 s action window holds a fixed command for 1000 solver steps / schedule rows."
  sample_ownership_rule: "Each 0.0001 s sample belongs to the active 0.1 s action window."
units:
  time: s
  force: N
  moment: N-m
  massflow: kg/s
  area: m^2
sign_convention: "force and moment retain STAR-CCM+ report signs"
massflow_sign_convention:
  raw_columns: star_actual_massflow_01..star_actual_massflow_24
  algorithm_columns: actual_massflow_01..actual_massflow_24
  algorithm_positive_direction: into_flow_domain
  conversion: "actual_massflow_NN = sign_to_domain * star_actual_massflow_NN"
  sign_to_domain: -1.0
  source: "STAR boundary mass-flow report on J01..J24"
validation:
  mode: partial_timeseries
  action_column_rule: "JET_NN/cmd_massflow_NN/actual_massflow_NN use the same NN and map only to JNN; JETNN is never an action target."
  unknown_report_rule: "warn_or_error; no automatic physical-meaning inference"
  missing_report_rule: "keep absent; do not derive or fill with zero"
  force_relationships:
    fz_equals_six_region_sum: "fz = Fz_S1L + Fz_S1R + Fz_S2L + Fz_S2R + Fz_S3L + Fz_S3R; 浩坤已确认，待后续算例验证。"
provenance:
  git_commit: "<git commit>"
