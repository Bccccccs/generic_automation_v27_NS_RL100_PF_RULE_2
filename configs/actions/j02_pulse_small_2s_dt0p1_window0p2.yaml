# 小样本 STAR 联调：2 s、10 个动作窗口；第 5 个窗口仅开启 J02。
actuation:
  mode: pulse_singlejet
  n_jets: 24
  total_windows: 10
  window_duration: 0.2
  time_step: 0.1
  mass_flow_rate: 0.015
  jet_ids: [2]
  # pulse_windows 按 1-based 编号：5 对应第 5 个窗口 [0.8, 1.0] s。
  pulse_windows: [5]

output:
  run_dir: runs/schedule_examples/j02_pulse_small_2s_dt0p1_window0p2
